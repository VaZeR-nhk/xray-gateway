name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Python syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('gateway/app.py', 'gateway/node_checks.py', 'gateway/routing_view.py', 'gateway/xray-gateway', 'tests/test_routing_view.py', 'tests/test_tproxy.py'):
              compile(Path(name).read_text(encoding='utf-8'), name, 'exec')
          PY
      - name: Shell syntax
        run: bash -n install.sh update.sh uninstall.sh host-network.sh tests/smoke.sh tests/test_host_network.sh docker/entrypoint.sh docker/update-loop.sh
      - name: Prepare CI environment
        run: cp .env.example .env && chmod 600 .env
      - name: Docker Compose validation
        run: docker compose config --quiet
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build --build-arg XRAY_VERSION=26.11.9 -t xray-gateway:ci .
      - name: Container smoke test
        run: bash tests/smoke.sh xray-gateway:ci
