name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Python syntax
        run: python3 -m py_compile gateway/app.py gateway/node_checks.py gateway/xray-gateway
      - name: Shell syntax
        run: bash -n install.sh update.sh uninstall.sh migrate-native.sh host-network.sh tests/smoke.sh docker/entrypoint.sh docker/update-loop.sh
      - name: Docker Compose validation
        run: docker compose config --quiet
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build --build-arg XRAY_VERSION=26.11.9 -t xray-gateway:ci .
      - name: Container smoke test
        run: bash tests/smoke.sh xray-gateway:ci
