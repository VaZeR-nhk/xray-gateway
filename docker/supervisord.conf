[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xray]
command=/usr/local/bin/xray run -config /etc/xray-gateway/config.json
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/xray.log
stderr_logfile=/var/log/supervisor/xray.log

[program:web]
command=/usr/bin/python3 /opt/xray-gateway/app.py
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web.log

[program:update-scheduler]
command=/opt/xray-gateway/docker/update-loop.sh
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/log/supervisor/gateway.log
stderr_logfile=/var/log/supervisor/gateway.log
